[workspace]
resolver = "2"
members = [
    "crates/cof2-core",
    "crates/cof2-storage",
    "src-tauri",
]

[workspace.package]
version = "0.9.6"
edition = "2021"
authors = ["Etienne Gagnon <faerian@gmail.com>"]
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3.10"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["javascript", "typescript"] }

[profile.dev.package."*"]
debug = 0

[profile.dev]
debug = 1

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
