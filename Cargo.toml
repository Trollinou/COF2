[workspace]
resolver = "2"
members = [
    "crates/cof2-core",
    "crates/cof2-storage",
    "src-tauri",
]

[workspace.package]
version = "1.0.5"
edition = "2021"
authors = ["Faerian <faerian@gmail.com>"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["javascript", "typescript"] }

[profile.dev.package."*"]
debug = 0

[profile.dev]
debug = 1
