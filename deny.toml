# Configuration cargo-deny : garde-fou sur les licences des dépendances Rust
# Exécution : cargo deny check licenses

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "PolyForm-Noncommercial-1.0.0",
]
confidence-threshold = 0.8
